pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

rootProject.name='CryonixLauncher'

// Keep the original CryonixLauncher module directory while preserving
// compatibility with existing Android Studio build configurations.
include ':app_pojavlauncher'
project(':app_pojavlauncher').projectDir = file('cryonixlauncher')

include ':forge_installer'
include ':glfw:jni_bindings'
include ':mojoexec:jni_bindings'
include ':sdl:jni_bindings'
// Cryonix Launcher project configuration
